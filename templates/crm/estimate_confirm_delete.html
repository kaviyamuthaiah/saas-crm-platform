{% extends "base.html" %}

{% block title %}
Delete Estimate
{% endblock %}

{% block content %}

<div class="row justify-content-center">

  <div class="col-md-6">

    <div class="card shadow-sm border-danger">

      <div class="card-header bg-danger text-white">

        <h5 class="mb-0">
          Delete Estimate
        </h5>

      </div>

      <div class="card-body">

        <p>

          Delete estimate:
          
          <strong>
            {{ object.estimate_number }}
          </strong>

          ?

        </p>

        {% if object.lead %}
        <p class="text-muted small mb-4">

          Related Lead:
          
          <strong>
            {{ object.lead.title }}
          </strong>

        </p>
        {% endif %}

        <form method="post">

          {% csrf_token %}

          <div class="d-flex gap-2">

            <button type="submit"
                    class="btn btn-danger">

              Delete

            </button>

            <a href="{% url 'crm:estimate_list' %}"
               class="btn btn-outline-secondary">

              Cancel

            </a>

          </div>

        </form>

      </div>

    </div>

  </div>

</div>

{% endblock %}
